<style>

  --link:#55bde2; --hover:#bdebfc; --rule:#363636; --toc:#272c34; --toc-title:#20252b;
  --code:#20252b; --shadow:rgba(0,0,0,.35); --btn:#252627; --btn-fg:#5d5d5f;
  --sky1:#24303a; --sky2:#2a3946; --l1:#2c3b46; --l2:#33495a; --l3:#3b576c; --l4:#446680; --ray:#55bde2; --ray2:#ef77a8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:5rem}
body{margin:0; background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI","Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5rem; transition:color .3s ease, background-color .3s ease}
a{color:var(--fg); text-decoration:none; transition:color .2s ease}
a:hover{color:var(--link)}
.content a, .post-meta a.author, .post-footer a.read-more{color:var(--link)}
.content a:hover, .post-meta a.author:hover, .post-footer a.read-more:hover{color:var(--hover)}
a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--link); outline-offset:2px; border-radius:3px}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
svg.i{width:1em; height:1em; vertical-align:-.125em; fill:currentColor; flex:none}
.skip{position:absolute; left:-999px; top:0}
.skip:focus{left:1rem; top:1rem; z-index:200; background:var(--bg); padding:.25rem .5rem}
.tbd{font-style:italic; color:var(--muted); border-bottom:1px dotted var(--muted); cursor:help}

/* ---------- Header (desktop) ---------- */
header.desktop{position:fixed; top:0; left:0; right:0; height:4rem; z-index:100;
  background:var(--header); box-shadow:0 1px 0 var(--shadow)}
.header-wrapper{display:flex; align-items:center; justify-content:space-between;
  height:100%; padding:0 clamp(1rem,7vw,5.5rem)}
.header-title{font-size:1.5rem; font-weight:700; letter-spacing:-.01em}
.header-title a{color:var(--header-fg)}
.menu{display:flex; align-items:center; gap:0}
.menu-item{padding:0 .65rem; color:var(--header-fg)}
.menu-item.active{font-weight:900}
.menu .delimiter{border-left:1.5px solid var(--header-fg); height:1.2rem; margin:0 .4rem; padding:0}
.lang{display:inline-flex; align-items:center; gap:.3rem}
.lang svg{width:.7em}
.search{position:relative; display:flex; align-items:center}
.search input{width:0; padding:0; border:0; height:1.9rem; background:transparent; color:var(--fg);
  font:inherit; font-size:.95rem; transition:width .3s ease, padding .3s ease; outline:none; border-radius:4px}
.search.open input{width:12rem; padding:0 .5rem; background:var(--bg); box-shadow:inset 0 0 0 1px var(--rule)}
.search-dropdown{position:absolute; top:2.6rem; right:0; width:min(26rem,90vw); background:var(--bg);
  box-shadow:0 .5rem 1.5rem var(--shadow); border-radius:6px; padding:.4rem 0; display:none; z-index:120}
.search-dropdown.show{display:block}
.search-dropdown a{display:block; padding:.45rem .9rem; line-height:1.35}
.search-dropdown a:hover,.search-dropdown a:focus{background:var(--toc)}
.search-dropdown .s-title{font-weight:600}
.search-dropdown .s-sum{display:block; color:var(--muted); font-size:.82rem}
.search-dropdown mark{background:none; color:var(--hover); font-weight:700}
.search-dropdown .s-none{padding:.45rem .9rem; color:var(--muted); font-size:.9rem}

/* ---------- Header (mobile) ---------- */
header.mobile{display:none; position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--header); box-shadow:0 1px 0 var(--shadow)}
header.mobile .bar{height:3.5rem; display:flex; align-items:center; justify-content:space-between; padding:0 1rem}
header.mobile .header-title{font-size:1.25rem}
.menu-toggle{width:1.6rem; height:1.6rem; position:relative}
.menu-toggle span{position:absolute; left:0; width:100%; height:2px; background:var(--header-fg); transition:transform .25s ease, opacity .25s ease}
.menu-toggle span:nth-child(1){top:.35rem}.menu-toggle span:nth-child(2){top:.75rem}.menu-toggle span:nth-child(3){top:1.15rem}
.menu-toggle.active span:nth-child(1){transform:translateY(.4rem) rotate(45deg)}
.menu-toggle.active span:nth-child(2){opacity:0}
.menu-toggle.active span:nth-child(3){transform:translateY(-.4rem) rotate(-45deg)}
header.mobile .menu{display:none; flex-direction:column; text-align:center; padding:.25rem 0 1rem; gap:0;
  border-top:1px solid var(--rule)}
header.mobile .menu.active{display:flex}
header.mobile .menu-item{display:block; padding:.55rem 0; width:100%}
header.mobile .search{padding:.5rem 1rem}
header.mobile .search input{width:100%; padding:0 .6rem; background:var(--bg); box-shadow:inset 0 0 0 1px var(--rule)}
header.mobile .search-dropdown{top:3rem; left:1rem; right:1rem; width:auto}

/* ---------- Page ---------- */
main{min-height:calc(100vh - 7rem)}
.page{width:min(690px, 100%); margin:0 auto; padding:6rem 1rem 2rem; position:relative}
.page.single{width:min(690px,100%)}

/* Home profile */
.home-profile{text-align:center; padding:6vh 0 1.5rem}
.home-avatar{display:inline-block; padding:.5rem}
.avatar{width:6rem; height:6rem; border-radius:50%; display:grid; place-items:center; margin:0 auto;
  border:2px dashed var(--muted); color:var(--muted); font-weight:600; letter-spacing:.06em;
  transition:transform .3s ease}
.avatar:hover{transform:translateY(-.75rem)}
.home-title{font-size:1.25rem; font-weight:700; margin:0; padding:.5rem}
.home-subtitle{font-size:1rem; font-weight:400; margin:0; padding:.25rem .5rem; min-height:1.5rem}
.typeit-cursor{display:inline-block; width:1px; height:1.05em; background:currentColor; vertical-align:-.15em; margin-left:2px}
@media (prefers-reduced-motion: no-preference){ .typeit-cursor{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}} }
.links{padding:.5rem; font-size:1.5rem; display:flex; justify-content:center; flex-wrap:wrap; gap:.35rem .25rem}
.links a, .links span{padding:0 .3rem; display:inline-flex}
.links .tbd-icon{color:var(--muted); opacity:.55; border:0; cursor:help}

/* Summary */
.summary{padding-top:1rem; padding-bottom:.8rem; border-bottom:1px dashed var(--rule)}
.featured-image-preview{display:block; width:100%; padding:30% 0 0; position:relative; margin:.6rem auto; border-radius:4px; overflow:hidden}
.featured-image-preview svg{position:absolute; inset:0; width:100%; height:100%; display:block;
  transition:transform .4s ease}
.featured-image-preview:hover svg{transform:scale(1.02)}
.single-title{margin:1rem 0 .5rem; font-size:1.6rem; font-weight:700; line-height:140%}
.post-meta{font-size:.875rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.15rem .7rem; align-items:baseline}
.post-meta .author{font-size:1rem}
.post-meta span{display:inline-flex; align-items:center; gap:.3rem}
.summary .content{color:var(--muted); margin:.7rem 0; line-height:1.75}
.post-footer{display:flex; justify-content:space-between; align-items:center; gap:1rem; font-size:.875rem; margin-top:.5rem}
.post-tags{text-align:right}
.post-tags svg{margin-right:.3rem}
.post-footer a.read-more{white-space:nowrap}
.post-tags svg{color:var(--muted)}
.summary.placeholder .single-title{color:var(--muted); font-weight:600}
.pagination{display:flex; justify-content:center; gap:2.2rem; margin:2rem 0 0; padding:0; list-style:none; font-size:.8rem; font-weight:700}
.pagination a{color:var(--muted); padding:.3rem .2rem}
.pagination .active a{color:var(--fg); border-bottom:3px solid var(--fg); padding-bottom:.45rem}

/* Archive */
.archive .single-title{text-align:right; padding-bottom:.4rem}
.group-title{margin:1.5rem 0 1rem; font-size:1.25rem; font-weight:700}
.archive-item{display:flex; justify-content:space-between; align-items:center; margin:.25rem 0 .25rem 1.5rem; line-height:2.25rem}
.archive-item-link{min-width:10%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.archive-item-date{min-width:4em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
.archive-item.tbd-item .archive-item-link{color:var(--muted); font-style:italic}

/* Tag cloud */
.tag-cloud-tags{margin:1.2rem 0}
.tag-cloud-tags a{display:inline-block; margin:5px 10px; transition:transform .3s ease-out, color .3s ease-out}
.tag-cloud-tags a:hover,.tag-cloud-tags a:focus{transform:scale(1.2); color:var(--link)}
.tag-cloud-tags sup{color:var(--muted)}

/* About */
.about .single-title{text-align:right}
.about-profile{text-align:center; margin:1rem 0 1.25rem}
.about-profile .name{display:block; margin-top:.6rem; color:var(--muted); font-size:.85rem; letter-spacing:.06em; text-transform:uppercase}
.content{line-height:1.75}
.content ul{padding-left:1.25rem}
.content li{margin:.2rem 0}
.content h2{font-size:1.4rem; margin:2rem 0 .75rem; line-height:1.4}
.content h2::before{content:"#"; color:var(--link); margin-right:.4rem}
.content blockquote{margin:1rem 0; padding:.5rem 1rem; border-left:.25rem solid var(--link); background:var(--toc)}
.content blockquote p{margin:.25rem 0}

/* Single post + TOC */
.single .post-meta{margin-bottom:1rem}
.single .post-meta .author{display:block; width:100%}
.toc{background:var(--toc); margin:1rem 0 1.5rem; border-radius:4px}
.toc-title{display:flex; justify-content:space-between; align-items:center; padding:0 .75rem; line-height:2.2em;
  background:var(--toc-title); font-weight:700; border-radius:4px 4px 0 0}
.toc ul{list-style:none; margin:0; padding:.4rem 1rem .5rem 1.4rem}
.toc li{margin:.15rem 0}
.toc a::before{content:"|"; font-weight:bolder; margin-right:.5rem; color:var(--link)}
.toc a.active{font-weight:700; color:var(--link)}
.toc a.active::before{color:var(--hover)}
@media (min-width:1200px){
  .toc.auto{position:absolute; left:calc(100% + 1rem); top:7.6rem; width:15rem; background:none; margin:0;
    border-left:4px solid var(--rule); border-radius:0}
  .toc.auto .toc-title{background:none; text-transform:uppercase; font-size:1.2rem; padding:0 1rem; margin:.4rem 0}
  .toc.auto ul{padding:.2rem 1rem .4rem 1rem}
  .toc.auto.fixed{position:fixed; top:5.5rem; left:calc(50% + 345px + 1rem)}
}
.post-info{margin-top:2.5rem; padding-top:1rem; border-top:1px dashed var(--rule); font-size:.875rem;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem}
.post-info .nav a{color:var(--fg)}
.post-info .nav a:hover{color:var(--link)}

/* 404 */
.notfound{text-align:center; padding-top:20vh}
.notfound h1{font-size:2rem}

/* Footer */
footer.footer{text-align:center; font-size:.875rem; line-height:1.4rem; padding:1rem 1rem 1.5rem}
footer .footer-line{margin:.1rem 0}
footer .sep{margin:0 .25rem}

/* Fixed buttons */
.fixed-button{position:fixed; right:1.5rem; bottom:1.5rem; width:2.6rem; height:2.6rem; border-radius:2rem;
  display:grid; place-items:center; background:var(--btn); color:var(--btn-fg); font-size:1rem;
  box-shadow:0 0 .25rem var(--shadow); opacity:0; visibility:hidden; transition:opacity .3s ease, color .2s ease; z-index:90}
.fixed-button.show{opacity:1; visibility:visible}
.fixed-button:hover{color:var(--fg)}

@media (max-width:680px){
  header.desktop{display:none}
  header.mobile{display:block}
  .page{padding-top:5rem}
  .single-title{font-size:1.4rem}
  .post-footer{flex-direction:column; align-items:flex-start}
  .post-tags{text-align:left}
  .archive-item{margin-left:.5rem}
  .home-profile{padding-top:2vh}
  .fixed-button{right:1rem; bottom:1rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>

/* ================= Helpers ================= */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slugTag(t){return t.toLowerCase().replace(/[^a-z0-9ä-ü]+/g,'-').replace(/^-|-$/g,'')}
function tagLink(t){return '<a href="#/tags/'+slugTag(t)+'/">'+esc(t)+'</a>'}
function plain(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function wordsOf(p){return plain(p.body).trim().split(/\s+/).length}
function dateRange(p){return p.date+(p.dateEnd?' – '+p.dateEnd.slice(5):'')}
function tbd(text,title){return '<span class="tbd" title="'+esc(title||'Placeholder — to be filled in by Yuhan')+'">'+text+'</span>'}

function archiveList(posts){
  var byYear={};posts.forEach(function(p){(byYear[p.date.slice(0,4)]=byYear[p.date.slice(0,4)]||[]).push(p)});
  return Object.keys(byYear).sort().reverse().map(function(y){
    return '<h3 class="group-title">'+y+'</h3>'+byYear[y].map(function(p){
      return '<article class="archive-item"><a class="archive-item-link" href="#/posts/'+p.slug+'/">'+esc(p.title)+'</a><span class="archive-item-date">'+p.date.slice(5)+'</span></article>';
    }).join('');
  }).join('');
}

function allTags(){var m={};POSTS.forEach(function(p){p.tags.forEach(function(t){m[t]=(m[t]||0)+1})});return m}
function viewTags(){
  var m=allTags();
  var cloud=Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b)}).map(function(t){
    return '<a href="#/tags/'+slugTag(t)+'/">'+esc(t)+' <sup>'+m[t]+'</sup></a>'}).join('');
  return '<div class="page archive"><h2 class="single-title">All Tags</h2><div class="tag-cloud-tags">'+cloud+'</div></div>';
}
function viewTag(slug){
  var name=null;Object.keys(allTags()).forEach(function(t){if(slugTag(t)===slug)name=t});

  return '<div class="page archive"><h2 class="single-title">Tag - '+esc(name)+'</h2>'+archiveList(ps)+'</div>';
}

var app=document.getElementById('app');
function render(){
  var h=location.hash.replace(/^#/,''); var anchor=null;
  var m=h.match(/^(\/posts\/[^#]+\/)#(.+)$/); if(m){h=m[1];anchor=m[2]}
  if(h===''||h==='/'||h==='top')h='/';
  var nav='home', html;
  var mm;
  if(h==='/'){html=viewHome()}
  else if(h==='/posts/'){html=viewPosts();nav='posts'}
  else if((mm=h.match(/^\/posts\/([^/]+)\/?$/))){html=viewPost(mm[1]);nav='posts'}
  else if(h==='/tags/'){html=viewTags();nav='tags'}
  else if((mm=h.match(/^\/tags\/([^/]+)\/?$/))){html=viewTag(decodeURIComponent(mm[1]));nav=mm[1]==='tomography'?'tomography':'tags'}
  else if(h==='/about/'){html=viewAbout();nav='about'}
  else {html=view404();nav=''}
  if(h==='top'){window.scrollTo({top:0,behavior:'smooth'});return}
  app.innerHTML=html;
  document.querySelectorAll('[data-nav]').forEach(function(a){
    var on=a.getAttribute('data-nav')===nav; a.classList.toggle('active',on);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var titles={home:'Yuhan Wang',posts:'All Posts - Yuhan Wang',tags:'All Tags - Yuhan Wang',about:'About - Yuhan Wang',tomography:'Tag - tomography - Yuhan Wang'};
  var t1=app.querySelector('h1.single-title'); document.title=(mm&&h.indexOf('/posts/')===0&&t1)?t1.textContent+' - Yuhan Wang':(titles[nav]||'Yuhan Wang');
  closeMobile(); wireEmail(); startTypeit(); setupToc();
  if(anchor){var el=document.getElementById(anchor); if(el)el.scrollIntoView()} else window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);

/* ================= Email (assembled at runtime) ================= */
function wireEmail(){
  var addr=user+'@'+domain;
  var hm=document.getElementById('home-mail'); if(hm){hm.href='mailto:'+addr; hm.title=addr}
  var am=document.getElementById('about-mail'); if(am){am.href='mailto:'+addr; am.textContent=addr}
}

/* ================= TypeIt-like subtitle ================= */
var typeTimer=null;
function startTypeit(){
  clearTimeout(typeTimer);
  var el=document.getElementById('typeit'); if(!el)return;
  var text='Seismology & Wave Physics · ETH Zürich';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;return}
  var i=0;(function step(){el.textContent=text.slice(0,i);if(i++<text.length)typeTimer=setTimeout(step,70)})();
}

/* ================= TOC highlight + sticky ================= */
var tocHandler=null;
function setupToc(){
  if(tocHandler){window.removeEventListener('scroll',tocHandler);tocHandler=null}
  var toc=document.getElementById('toc'); if(!toc)return;
  var links=[].slice.call(toc.querySelectorAll('a'));
  links.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();
    var el=document.getElementById(a.getAttribute('data-target')); if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})});
  var start=toc.getBoundingClientRect().top+window.scrollY;
  tocHandler=function(){
    toc.classList.toggle('fixed',window.innerWidth>=1200&&window.scrollY>start-88);
    var cur=null;links.forEach(function(a){var el=document.getElementById(a.getAttribute('data-target'));if(el&&el.getBoundingClientRect().top<120)cur=a});
    links.forEach(function(a){a.classList.toggle('active',a===cur)});
  };
  window.addEventListener('scroll',tocHandler,{passive:true}); tocHandler();
}

/* ================= Theme switch ================= */
document.querySelectorAll('.theme-switch').forEach(function(b){b.addEventListener('click',function(){
  var dark=document.documentElement.getAttribute('theme')!=='dark';
  document.documentElement.setAttribute('theme',dark?'dark':'light');
  try{localStorage.setItem('theme',dark?'dark':'light')}catch(e){}
})});
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){
  var t=null;try{t=localStorage.getItem('theme')}catch(_){}
  if(!t)document.documentElement.setAttribute('theme',e.matches?'dark':'light')})}

/* ================= Mobile menu ================= */
var toggle=document.getElementById('menu-toggle'), mmenu=document.getElementById('menu-mobile');
toggle.addEventListener('click',function(){var on=!mmenu.classList.contains('active');
  mmenu.classList.toggle('active',on);toggle.classList.toggle('active',on);toggle.setAttribute('aria-expanded',on)});
function closeMobile(){mmenu.classList.remove('active');toggle.classList.remove('active');toggle.setAttribute('aria-expanded','false')}

/* ================= Search ================= */
var INDEX=POSTS.map(function(p){return {title:p.title,url:'#/posts/'+p.slug+'/',text:p.summary+' '+plain(p.body)+' '+p.tags.join(' ')}})
  .concat([{title:'About',url:'#/about/',text:'Yuhan Wang Seismology & Wave Physics group Department of Earth and Planetary Sciences ETH Zürich Switzerland Google Scholar ORCID GitHub LinkedIn'}]);
function hi(s,q){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
function setupSearch(box,collapsible){
  var input=box.querySelector('input'), dd=box.querySelector('.search-dropdown'), tg=box.querySelector('.search-toggle');
  if(tg)tg.addEventListener('click',function(){box.classList.add('open');input.focus()});
  input.addEventListener('input',function(){
    var q=input.value.trim().toLowerCase(); if(!q){dd.classList.remove('show');dd.innerHTML='';return}
    var r=INDEX.filter(function(d){return (d.title+' '+d.text).toLowerCase().indexOf(q)>-1});
    dd.innerHTML=r.length?r.map(function(d){var i=d.text.toLowerCase().indexOf(q),s=i<0?d.text.slice(0,90):d.text.slice(Math.max(0,i-30),i+60);
      return '<a href="'+d.url+'" role="option"><span class="s-title">'+hi(d.title,q)+'</span><span class="s-sum">…'+hi(s,q)+'…</span></a>'}).join('')
      :'<div class="s-none">No results found</div>';
    dd.classList.add('show');
  });
  input.addEventListener('keydown',function(e){if(e.key==='Escape'){input.value='';dd.classList.remove('show');if(collapsible){box.classList.remove('open');tg&&tg.focus()}}
    if(e.key==='Enter'){var f=dd.querySelector('a');if(f)location.hash=f.getAttribute('href').slice(1)}});
  dd.addEventListener('click',function(){input.value='';dd.classList.remove('show');box.classList.remove('open')});
  document.addEventListener('click',function(e){if(!box.contains(e.target)){dd.classList.remove('show');if(collapsible&&!input.value)box.classList.remove('open')}});
}
setupSearch(document.getElementById('search-desktop'),true);
setupSearch(document.getElementById('search-mobile'),false);

/* ================= Back to top ================= */
var btt=document.getElementById('back-to-top');
btt.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
window.addEventListener('scroll',function(){btt.classList.toggle('show',window.scrollY>300)},{passive:true});

render();
})();
</script>
