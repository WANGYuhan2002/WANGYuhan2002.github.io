<!doctype html>
<!-- r2 mock · gallery of round-2 data panels, field overlays and inspector fragments (design/v2a-design-spec-r2.md).
     Static and synthetic: no solver. Cards use the real lab markup and CSS. #light starts in the light theme. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Round-2 panels · Wave Lab mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2-mock.css">
<style>
  html, body{height:auto}
  body{overflow:auto}
  .gal{max-width:900px; margin:0 auto; padding:28px 14px 60px}
  .gal-h{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 6px}
  .gal-h h1{margin:0; font:700 24px/1.2 var(--display); letter-spacing:-.02em}
  .gal > p{margin:0 0 22px; color:var(--muted); font-size:13px}
  .item{margin:0 0 30px; padding:6px 0 0}
  .item h2{margin:0 0 8px; font:600 14px/1.3 var(--sans); color:var(--ink)}
  .item h2 i{font:500 11px var(--mono); font-style:normal; color:var(--muted); margin-right:8px; text-transform:uppercase; letter-spacing:.06em}
  .item .data{width:872px}
  .item #datac, .item .datac{flex:none; height:240px; width:100%; display:block}
  .item .view{width:872px}
  .item .view canvas{position:absolute; inset:0; width:100%; height:100%}
  .item .fkey{width:872px; margin:6px 0 0}
  /* the gallery is viewed at 1000 px, inside the 900–1199 px media query that hides .facts in the lab; show them here */
  .gal .facts{display:flex}
  html.only .gal{padding:0; margin:0} html.only .gal-h, html.only .gal > p, html.only .item > h2{display:none} html.only .item{margin:0; padding:0} html.only, html.only body{background:transparent} html.only .frags{gap:0}
  .frags{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start}
  .frag{width:348px; margin:0; overflow:visible; height:auto; padding:18px 16px 18px}
  .frag .res{margin-top:0}
</style>
</head>
<body>
<div class="gal">
  <div class="gal-h"><h1>Round-2 panels</h1>
    <button class="ibtn theme-btn" id="themeBtn" type="button" aria-label="Switch between dark and light theme" title="Dark / light theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <p>Static mocks of design/v2a-design-spec-r2.md, sections 3–6. Synthetic data, real card markup and CSS.</p>
  <div id="items"></div>
</div>

<script src="../../drafts/v2a/js/wave-models.js"></script>
<script src="r2-mock.js"></script>
<script>
(function () {
  'use strict';
  var WM = window.WaveModels, C = L.C, NOW = L.NOW, LEN = L.TR, RATE = L.rate, FHZ = L.fHz;
  var CAP = {
    play0: 'Time runs left to right and ends at “now”. Click the wavefield to make a quake.',
    play1: L.glyph('star') + ' is the quake’s origin time; the dashed line is the arrival predicted for a straight ray.',
    playN: 'One row per station, nearest to the quake on top. Dashed curve: arrivals predicted for straight rays.',
    line: 'One row per station along the array. An upright band is fast (all stations at once); a leaning band is slow.',
    das: 'Rows are positions along the cable, colour is strain rate. Broadside waves leave almost no trace.',
    trDone: 'Recordings played backwards · pressure² at the source, peaking on the dashed line · the focal spot, magnified.',
    noise: 'Peaks grow at lag ±t<sub>AB</sub>, the A–B travel time. Positive lag: waves going A → B; negative lag: B → A.',
    elastic: 'Z and X ground velocity with the predicted P and S arrivals. Right: the path the ground traces.'
  };
  var AGC = L.seg('agc', [['0', 'True amplitude'], ['1', 'AGC 0.5 s']], '0', 'sm');
  function dataCard(id, title, o) {
    var t = document.createElement('p'); t.innerHTML = o.cap;
    return '<section class="data" aria-label="Data panel"><div class="data-h"><h2>' + title + '</h2><div class="data-r">' +
      '<div class="kpis">' + (o.kpi || '') + '</div><div class="data-ctl">' + (o.ctl || '') + '</div></div>' +
      '<div class="data-c"><p class="data-cap" title="' + t.textContent + '">' + o.cap + '</p><span class="lkey"' + (o.key ? '' : ' hidden') + '><i class="obs"></i>observed<i class="pre"></i>predicted</span></div>' +
      '</div><canvas class="datac" id="c-' + id + '"></canvas></section>';
  }
  function item(id, head, body) { return '<section class="item" id="item-' + id + '"><h2><i>' + id + '</i>' + head + '</h2>' + body + '</section>'; }
  var ITEMS = '';
  ITEMS += item('a', 'Playground · six stations, record section sorted by distance', dataCard('a', '<b>6</b> stations · pressure p(t) · last 6 s', { key: true, cap: CAP.playN, ctl: AGC }));
  ITEMS += item('b', 'Playground · one station, origin time and predicted arrival', dataCard('b', 'Station <b>YW01</b> · pressure p(t) · last 6 s', { key: true, cap: CAP.play1, ctl: AGC }));
  ITEMS += item('c', 'Arrays · 16-station line array with the apparent-velocity protractor', dataCard('c', 'Line array · <b>16</b> stations · pressure p(t) · last 6 s', { key: true, cap: CAP.line, ctl: AGC }));
  ITEMS += item('d', 'Arrays · DAS waterfall', dataCard('d', 'DAS · axial strain rate · <b>155</b> channels over 8.0 km · gauge 0.25 km · last 6 s', { key: true, cap: CAP.das, ctl: L.seg('perch', [['0', 'Common scale'], ['1', 'Per channel']], '0', 'sm') }));
  ITEMS += item('e', 'Time reversal · done: recordings, pressure² at the source, focal spot', dataCard('e', 'Time-reversal mirror · <b>48</b> sensors · pressure p(t)', { key: true, cap: CAP.trDone, kpi: '<span class="kpi"><b>0.41 λ</b>focal spot</span><span class="kpi dim" title="Half-maximum width of J₀(kr)², the focus of a perfect ring at one frequency"><b>0.36 λ</b>theory</span>' }));
  ITEMS += item('f', 'Time reversal · focusing image on the field (linear p²)', '<div class="view" style="height:442px"><canvas id="v-f"></canvas></div><div class="fkey" id="k-f"><div class="legend"></div><div class="facts"></div></div>');
  ITEMS += item('g', 'Ambient noise · SNR growth and the measured peak lag', dataCard('g', 'Noise at <b>A</b> and <b>B</b> → their cross-correlation', { key: true, cap: CAP.noise, kpi: '<span id="g-kpi"></span>' }));
  ITEMS += item('h', 'Elastic waves · predicted P and S, the S − P bracket', dataCard('h', 'Station <b>YW01</b> on the surface · ground velocity · Z (up) and X (right) · last 6 s', { key: true, cap: CAP.elastic, kpi: '<span class="kpi dim"><b>1.06 s</b>S − P</span><span class="kpi"><b>3.6 km</b>distance</span>' }));
  ITEMS += item('i', 'Field overlay · cross-section with a free surface', '<div class="view" style="height:302px"><canvas id="v-i"></canvas></div><div class="fkey" id="k-i"><div class="legend"></div><div class="facts"></div></div>');
  ITEMS += item('j', 'Inspector fragments · elastic steps, noise result, time-reversal result', '<div class="frags" id="frags"></div>');
  document.getElementById('items').innerHTML = ITEMS;
  /* ?only=a,c (and j1 = the elastic fragment of j alone): one or more items without the gallery chrome, for r2-compare.html */
  var ONLY = (/[?&]only=([^&]+)/.exec(location.search) || [])[1];
  if (ONLY) {
    var want = ONLY.split(','); document.documentElement.classList.add('only');
    [].forEach.call(document.querySelectorAll('.item'), function (el) { var id = el.id.slice(5); if (want.indexOf(id) < 0 && !(id === 'j' && want.indexOf('j1') >= 0)) el.style.display = 'none'; });
  }
  var GEOM = window.__geom = {};
  /* the noise KPI span is replaced by its chips once vEst is known */

  var mRandom = new WM.Model(400, 220); mRandom.setPreset('random');
  var mLayer = new WM.Model(400, 220); mLayer.setPreset('layered', 4);
  var r = L.rng(42), k, i;
  function band(t, f) { return L.ricker(t, f || FHZ); }
  function predN(model, m, p) { return m.n + Math.round(1.2 / (L.f0 * (m.fm || 1))) + model.travelTime(m.x, m.y, p.x, p.y, RATE) * RATE; }

  /* ---------- a · playground, six stations ---------- */
  var qa = { n: NOW - Math.round(4.4 * RATE), x: 150, y: 80, fm: 1 };
  var staA = [[300, 120], [190, 60], [80, 170], [330, 40], [230, 160], [162, 88]].map(function (p, k) { return { x: p[0], y: p[1], code: 'YW0' + (k + 1) }; });
  function quakeRec(model, q, pts, extra) {
    return new L.Rec(pts, LEN, function (tr, t, comp) {
      if (comp) return 0;
      var p = pts[tr], d = L.km(Math.hypot(p.x - q.x, p.y - q.y)), ageArr = (NOW - predN(model, q, p)) / RATE + 0.012 * d;
      var v = band(ageArr - t) / Math.sqrt(0.6 + d) + 0.35 * band(ageArr - 0.42 - t) / (1 + d);
      if (extra) v += extra(tr, t, ageArr, d);
      return v;
    });
  }
  var recA = quakeRec(mRandom, qa, staA), dA = staA.map(function (p) { return Math.hypot(p.x - qa.x, p.y - qa.y); });
  var ordA = dA.map(function (d, k) { return k; }).sort(function (a, b) { return dA[a] - dA[b]; });
  function drawA(ctx, w, h) {
    var g = L.drawSection(ctx, 14, 4, w - 28, h - 24, recA, { marks: [qa], now: NOW, pred: function (tr) { return predN(mRandom, qa, staA[tr]); }, order: ordA, right: 46,
      rowText: function (tr) { return L.fmt(L.km(dA[tr]), 1) + ' km'; }, link: true, hi: L.hi });
    L.timeAxis(ctx, g.x, h - 20, g.w, 4, LEN, NOW, 4);
    L.font(ctx, 10); GEOM.a = { star: [g.marks[0][0], 11], pred: g.pred, km: [w - 14 - ctx.measureText('2.8 km').width, g.pred[2][1]], g: g };
  }
  /* ---------- b · one station ---------- */
  var qb = { n: NOW - Math.round(3.6 * RATE), x: 120, y: 70, fm: 1 }, staB = [{ x: 250, y: 120, code: 'YW01' }];
  var recB = quakeRec(mRandom, qb, staB);
  function drawB(ctx, w, h) {
    var g = L.drawSection(ctx, 14, 4, w - 28, h - 24, recB, { marks: [qb], now: NOW, pred: function (tr) { return predN(mRandom, qb, staB[tr]); }, hi: L.hi, pen: true });
    L.timeAxis(ctx, g.x, h - 20, g.w, 4, LEN, NOW, 4);
  }
  /* ---------- c · line array of 16 on the layered section ---------- */
  var qc = { n: NOW - Math.round(4.6 * RATE), x: 130, y: 150, fm: 1 }, staC = [];
  for (k = 0; k < 16; k++) staC.push({ x: Math.round(40 + 319 * k / 15), y: 6, code: 'L' + (k < 9 ? '0' : '') + (k + 1) });
  var spC = L.km(319 / 15);
  var recC = quakeRec(mLayer, qc, staC, function (tr, t, ageArr, d) { var dr = Math.hypot(L.km(staC[tr].x - qc.x), 2 * 3.0 - L.km(qc.y)); return -0.45 * band(ageArr - (dr - d) / 2.9 - 0.25 - t) / Math.sqrt(1 + dr); });
  function drawC(ctx, w, h) {
    var g = L.drawSection(ctx, 14, 4, w - 28, h - 24, recC, { marks: [qc], now: NOW, pred: function (tr) { return predN(mLayer, qc, staC[tr]); }, right: 46,
      rowText: function (tr) { return L.fmt(tr * spC, 1) + ' km'; }, link: true, hi: L.hi });
    L.timeAxis(ctx, g.x, h - 20, g.w, 4, LEN, NOW, 4);
    window.__fanC = L.slopeFan(ctx, g.x + 12, g.y + g.h - 62, g.w / 6, g.sp / spC, 0.3 * g.w, g.y + g.h);
    window.__gA = g; GEOM.c = { fan: window.__fanC, g: g };
  }
  /* ---------- d · DAS along the surface ---------- */
  var qd = { n: NOW - Math.round(4.2 * RATE), x: 150, y: 140, fm: 1 }, dasPts = [], dasCh = [];
  for (k = 0; k <= 320; k++) dasPts.push([40 + k, 4]);
  for (k = 6; k < 321 - 5 - 1; k += 2) dasCh.push(k);
  var nc = dasCh.length;
  function dasPred(c) { var p = dasPts[dasCh[c]]; return predN(mLayer, qd, { x: p[0], y: p[1] }); }
  var dasBuf = new Float32Array(nc * LEN), dasPeak = 0;
  for (var c = 0; c < nc; c++) {
    var p = dasPts[dasCh[c]], dx = p[0] - qd.x, dz = p[1] - qd.y, dd = Math.hypot(dx, dz), cs = dx / dd, ageA = (NOW - dasPred(c)) / RATE + 0.01 * L.km(dd);
    var dr = Math.hypot(dx, 2 * 190 - qd.y - p[1]), csr = dx / dr, ageR = ageA - (dr - dd) / C / RATE * 0.8;
    for (i = 0; i < LEN; i++) {
      var t = (LEN - 1 - i) / RATE, e = 0.004;
      var v = cs * Math.abs(cs) * (band(ageA - t - e) - band(ageA - t + e)) / Math.sqrt(1 + L.km(dd)) + 0.5 * csr * Math.abs(csr) * (band(ageR - t - e) - band(ageR - t + e)) / Math.sqrt(1 + L.km(dr)) + 0.0012 * L.gauss(r);
      dasBuf[c * LEN + i] = v; dasPeak = Math.max(dasPeak, Math.abs(v));
    }
  }
  function drawD(ctx, w, h) {
    var pal = L.pal, X = 14 + 50, Wd = w - 28 - 50, Y = 18, Hd = h - 22 - Y, cols = Math.round(Wd), cv = document.createElement('canvas');
    cv.width = cols; cv.height = nc; var c2 = cv.getContext('2d'), img = c2.createImageData(cols, nc), d = img.data, bin = LEN / cols;
    for (var c = 0; c < nc; c++) for (var col = 0; col < cols; col++) {
      var i0 = Math.floor(col * bin), i1 = Math.max(i0 + 1, Math.floor((col + 1) * bin)), best = 0;
      for (var q = i0; q < i1; q++) { var v = dasBuf[c * LEN + q]; if (Math.abs(v) > Math.abs(best)) best = v; }
      var rgb = L.div(best / (0.75 * dasPeak)), j = 4 * (c * cols + col); d[j] = rgb[0]; d[j + 1] = rgb[1]; d[j + 2] = rgb[2]; d[j + 3] = 255;
    }
    c2.putImageData(img, 0, 0); ctx.imageSmoothingEnabled = true; ctx.drawImage(cv, X, Y, Wd, Hd);
    ctx.lineWidth = 1; ctx.strokeStyle = pal.tick; ctx.strokeRect(X + 0.5, Y + 0.5, Wd - 1, Hd - 1);
    var kmT = L.km(320), yk = function (km) { return Y + km / kmT * Hd; };
    ctx.strokeStyle = pal.axis; ctx.beginPath(); for (k = 0; k <= Math.floor(kmT); k++) { ctx.moveTo(X - 4, Math.round(yk(k)) + 0.5); ctx.lineTo(X, Math.round(yk(k)) + 0.5); } ctx.stroke();
    L.num(ctx); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; for (k = 0; k <= Math.floor(kmT); k += 2) ctx.fillText(String(k), X - 6, yk(k));
    ctx.save(); ctx.translate(18, Y + Hd / 2); ctx.rotate(-Math.PI / 2); L.axisTitle(ctx); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('distance along the cable (km)', 0, 0); ctx.restore();
    /* origin time: solid line + star in the 14-px lane */
    var xm = Math.round(X + Wd - (NOW - qd.n) / LEN * Wd) + 0.5;
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(' + pal.origin + ',.5)'; ctx.beginPath(); ctx.moveTo(xm, Y - 2); ctx.lineTo(xm, Y + Hd); ctx.stroke();
        /* predicted arrival: dashed polyline over the channels */
    ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.strokeStyle = L.rgba(pal.ink, 0.9); ctx.beginPath(); var pen = false;
    for (c = 0; c < nc; c++) { var age = NOW - dasPred(c); if (age < 0 || age > LEN) { pen = false; continue; } var xx = X + Wd - age / LEN * Wd, yy = Y + (c + 0.5) / nc * Hd; if (pen) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy); pen = true; }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = L.rgba(pal.pos, 0.45); ctx.beginPath(); ctx.moveTo(X + Wd - 0.5, Y); ctx.lineTo(X + Wd - 0.5, Y + Hd); ctx.stroke();   /* "now" */
    L.timeAxis(ctx, X, h - 20, Wd, 4, LEN, NOW);
    window.__fanD = L.slopeFan(ctx, X + 12, Y + Hd - 62, Wd / 6, Hd / kmT, 0.3 * Wd, Y + Hd);
    L.star(ctx, xm, 4 + 7, 4.5, pal.neg, 0.95); L.laneText(ctx, 'origin time', xm, 6, X + Wd, 'rgba(' + pal.origin + ',.95)', 9, 80);
  }
  /* ---------- e · time reversal, done ---------- */
  var ringC = [200, 110], ringR = 60, src = [193, 104], trPts = [], trLen, trRec = [], n0 = L.n0;
  for (k = 0; k < 48; k++) { var an = -Math.PI / 2 + 2 * Math.PI * k / 48; trPts.push({ x: Math.round(ringC[0] + ringR * Math.cos(an)), y: Math.round(ringC[1] + ringR * Math.sin(an)), code: 'M' + (k < 9 ? '0' : '') + (k + 1) }); }
  var dmaxT = 0; trPts.forEach(function (p) { dmaxT = Math.max(dmaxT, Math.hypot(p.x - src[0], p.y - src[1])); });
  trLen = Math.round(dmaxT / (C * 0.95) + 2.6 * n0 + 0.35 * RATE);
  trPts.forEach(function (p) { var d = Math.hypot(p.x - src[0], p.y - src[1]), ta = n0 + d / C, a = new Float32Array(trLen); for (i = 0; i < trLen; i++) a[i] = L.ricker((i - ta) * L.f0, 1) / Math.sqrt(d) + 0.002 * L.gauss(r); trRec.push(a); });
  var kf = trLen - 1 - n0, total = trLen + Math.round(0.7 * RATE), focusTr = new Float32Array(total);
  for (i = 0; i < total; i++) { var pv = L.ricker((i - kf) * L.f0 * 1.05, 1) + 0.03 * L.gauss(r) * Math.exp(-Math.abs(i - kf) / 120); focusTr[i] = pv * pv; }
  var lam = L.ppw, fwx = 0.42, fwz = 0.40;                                /* FWHM in λ; mean 0.41 */
  function spot(dxc, dzc) { var u = Math.hypot(2 * dxc / (fwx * lam), 2 * dzc / (fwz * lam)), j0 = L.J0(1.126 * u); return j0 * j0; }
  function drawE(ctx, w, h) {
    var pal = L.pal, nR = 48, show = [], wl = Math.round(w * 0.56), X = 14 + 42, Wt = wl - 14 - 42 - 10, H = h - 28, len = trLen, peak = 1e-9;
    for (k = 0; k < nR; k += 2) show.push(k);
    show.forEach(function (q) { for (i = 0; i < len; i++) peak = Math.max(peak, Math.abs(trRec[q][i])); });
    L.panelLabel(ctx, 'Recordings · re-emitted last sample first', 14, 2, null, X + Wt - 14);
    var sp = (H - 14) / show.length, amp = 0.9 * sp / peak, stride = Math.max(1, Math.floor(len / (Wt * 1.5)));
    for (var q = 0; q < show.length; q++) {
      var rr = show[q], y0 = 18 + sp * (q + 0.5), a = trRec[rr];
      if (q % 2 === 0) { L.font(ctx, 10); ctx.fillStyle = pal.label; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(trPts[rr].code, 14, y0); }
      ctx.beginPath(); ctx.moveTo(X, y0); for (i = 0; i < len; i += stride) ctx.lineTo(X + i / (len - 1) * Wt, y0 - Math.max(0, Math.min(1.4 * sp, a[i] * amp))); ctx.lineTo(X + Wt, y0); ctx.closePath(); ctx.fillStyle = pal.fill; ctx.fill();
      ctx.beginPath(); for (i = 0; i < len; i += stride) { var yy = y0 - Math.max(-1.4 * sp, Math.min(1.4 * sp, a[i] * amp)); if (i) ctx.lineTo(X + i / (len - 1) * Wt, yy); else ctx.moveTo(X, yy); } ctx.strokeStyle = pal.trace; ctx.lineWidth = 1; ctx.stroke();
    }
    var tLast = Math.floor(len / RATE * 2) / 2, xT = function (t) { return X + t * RATE / (len - 1) * Wt; }, tt;
    ctx.lineWidth = 1; ctx.strokeStyle = pal.axis; ctx.beginPath(); ctx.moveTo(X, H + 4.5); ctx.lineTo(X + Wt, H + 4.5);
    for (tt = 0; tt <= tLast + 1e-9; tt += 0.5) { ctx.moveTo(Math.round(xT(tt)) + 0.5, H + 4); ctx.lineTo(Math.round(xT(tt)) + 0.5, H + 8); } ctx.stroke();
    L.num(ctx); ctx.textBaseline = 'top';
    for (tt = 0; tt <= tLast + 1e-9; tt += 0.5) { ctx.textAlign = tt === 0 ? 'left' : 'center'; ctx.fillText(tt === 0 ? '0' : (L.fmt(tt, 1) + (tt + 0.5 > tLast + 1e-9 ? ' s' : '')), xT(tt), H + 10); }
    window.__eAxis = { ticks: tLast / 0.5 + 1, pxPerTick: xT(0.5) - xT(0) };
    /* middle: pressure² at the source */
    var x0 = wl + 10, W2 = Math.round(w * 0.20), H2 = H - 14, mxF = 0; for (i = 0; i < total; i++) mxF = Math.max(mxF, focusTr[i]);
    L.panelLabel(ctx, 'Pressure² at the source', x0, 2, null, W2);
    ctx.lineWidth = 1; ctx.strokeStyle = pal.tick; ctx.strokeRect(x0 + 0.5, 16.5, W2 - 1, H2 - 1);
    var xf = Math.round(x0 + kf / (total - 1) * W2) + 0.5; ctx.setLineDash([4, 3]); ctx.strokeStyle = L.rgba(pal.pos, 0.9); ctx.beginPath(); ctx.moveTo(xf, 17); ctx.lineTo(xf, 16 + H2); ctx.stroke(); ctx.setLineDash([]);

    GEOM.h = { br: [(xP + xS) / 2, yb], row: [20, 4 + lane + half * 0.5 - 8] };
    var bt = 'S − P = ' + L.fmt(tsE - tpE, 2) + ' s'; L.annot(ctx, pal.sub); var bw = ctx.measureText(bt).width;
    ctx.fillStyle = L.rgba(pal.pn, 0.85); ctx.fillRect((xP + xS) / 2 - bw / 2 - 3, yb - 16, bw + 6, 14); L.annot(ctx, pal.sub); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(bt, (xP + xS) / 2, yb - 3);
    /* particle motion */
    var x0 = w - 14 - hw, y0 = 16, S2 = Math.min(hw, H - 14), n = Math.round(1.2 * RATE), pm = 1e-9;
    L.panelLabel(ctx, 'Particle motion · last 1.2 s', x0, 2, null, S2);
    ctx.lineWidth = 1; ctx.strokeStyle = pal.tick; ctx.strokeRect(x0 + 0.5, y0 + 0.5, S2 - 1, S2 - 1);
    ctx.strokeStyle = pal.grid; ctx.beginPath(); ctx.moveTo(x0 + S2 / 2, y0); ctx.lineTo(x0 + S2 / 2, y0 + S2); ctx.moveTo(x0, y0 + S2 / 2); ctx.lineTo(x0 + S2, y0 + S2 / 2); ctx.stroke();
    for (i = rec.len - n; i < rec.len; i++) pm = Math.max(pm, Math.abs(rec.get(0, i, 0)), Math.abs(rec.get(0, i, 1)));
    var PX = function (i) { return x0 + S2 / 2 + rec.get(0, i, 1) / pm * (S2 / 2 - 6); }, PZ = function (i) { return y0 + S2 / 2 - rec.get(0, i, 0) / pm * (S2 / 2 - 6); };
    for (i = rec.len - n + 1; i < rec.len; i++) { var a = (i - (rec.len - n)) / n; ctx.strokeStyle = L.rgba(pal.pos, 0.12 + 0.85 * a); ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(PX(i - 1), PZ(i - 1)); ctx.lineTo(PX(i), PZ(i)); ctx.stroke(); }
    ctx.lineCap = 'butt'; ctx.beginPath(); ctx.arc(PX(rec.len - 1), PZ(rec.len - 1), 3, 0, 6.2832); ctx.fillStyle = L.rgba(pal.pos, 1); ctx.fill();
    L.axisTitle(ctx); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('X →', x0 + S2 - 3, y0 + S2 / 2 - 2); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('Z ↑', x0 + S2 / 2 + 3, y0 + 2);
  }
  /* ---------- i · cross-section overlay ---------- */
  function drawI() {
    var f = L.fit(document.getElementById('v-i')), ctx = f.ctx, pal = L.pal; L.view(f.w, f.h, 400);
    var m = new WM.Model(L.nx, L.ny); m.setPreset('layered', 4); L.drawWash(ctx, m);
    L.edges(ctx, 'free');
    L.star(ctx, L.sx(250), L.sy(78), 6, pal.neg, 0.85, true);
    var P = []; for (k = 0; k < L.ny - L.B - 4 - 4; k++) P.push([288, 4 + k]);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); P.forEach(function (q, j) { if (j) ctx.lineTo(L.sx(q[0]), L.sy(q[1])); else ctx.moveTo(L.sx(q[0]), L.sy(q[1])); });
    ctx.strokeStyle = pal.halo; ctx.lineWidth = 4.5; ctx.stroke(); ctx.strokeStyle = L.rgba(pal.pos, 0.95); ctx.lineWidth = 2; ctx.stroke();
    for (k = 40; k < P.length; k += 40) { ctx.beginPath(); ctx.arc(L.sx(P[k][0]), L.sy(P[k][1]), 2, 0, 6.2832); ctx.fillStyle = L.rgba(pal.ink, 0.9); ctx.fill(); }
    ctx.beginPath(); ctx.arc(L.sx(P[0][0]), L.sy(P[0][1]), 4, 0, 6.2832); ctx.fillStyle = L.rgba(pal.pos, 1); ctx.fill();
    var sy0 = L.sy(P[0][1]); L.label(ctx, '0 km', L.sx(P[0][0]) + 4, sy0 < 24 ? sy0 + 18 : sy0 - 9, 'left');
    L.stations(ctx, [{ x: 130, y: 0.5, code: 'YW01' }]);
    L.scaleBar(ctx);
    var key = document.getElementById('k-i');
    key.querySelector('.legend').innerHTML = L.legendAcoustic() + '<span>' + L.glyph('fibre') + 'fibre · dot = 1 km</span>';
    key.querySelector('.facts').innerHTML = L.facts('free');
    window.__fitI = L.fitKey(key);
  }
  /* ---------- j · inspector fragments ---------- */
  function frags() {
    var el = L.steps([
      { t: 'Click just below the surface', k: 'observe', d: 'Look for the slow, strong wave hugging the top edge: a <b>Rayleigh wave</b>. The ground under the station moves in ellipses (particle-motion plot, bottom right).', done: true },
      { t: 'Click deep below the station', k: 'interpret', d: '<b>P</b> arrives first, <b>S</b> later; the gap grows with distance.', eq: 'd ≈ Δt<sub>S−P</sub> · V<sub>P</sub>V<sub>S</sub> / (V<sub>P</sub> − V<sub>S</sub>)',
        c: '<div id="spLive"><p class="res-big"><b>3.6 km</b><span>distance from the predicted S − P time · check that P and S arrive on the dashed lines</span></p><dl class="kv"><dt>S − P time, predicted</dt><dd>1.06 s</dd><dt>× V<sub>P</sub> / (√3 − 1)</dt><dd>3.42 km/s</dd><dt>Mean V<sub>P</sub> on the path</dt><dd>2.50 km/s</dd></dl></div>', done: true },
      { t: 'Change the source', k: 'explore', d: 'An explosion radiates P only. A shear dislocation (a small fault) radiates mostly S, in four lobes. A vertical force is a hammer blow, the classic Lamb problem.', c: L.seg('kind', [['0', 'Explosion'], ['1', 'Shear'], ['2', 'Vertical force']], '0') },
      { t: 'Try a layered crust', k: 'explore', d: 'At every interface part of the P energy converts into S, and back: the extra arrivals in the seismogram.', c: '<div class="grid2" style="margin-bottom:4px">' + L.opt('p', 'h', 'Half-space', true) + '</div><p class="st-d" style="margin:.55rem 0 .3rem">Cross-sections · top edge = the surface</p><div class="grid2">' + L.opt('p', 'l', 'Folded &amp; faulted layers') + L.opt('p', 'b', 'Sedimentary basin') + L.opt('p', 's', 'Subduction zone') + L.opt('p', 'd', 'Salt dome') + '</div>' }
    ]);
    var noiseRes = '<div class="res" id="nRes"><h3>Interferometry</h3>' + (vEst ? '<p class="res-big"><b>' + L.fmt(vEst, 2) + ' km/s</b><span>velocity between A and B from the peak lag · true 2.50 km/s</span></p>' : '<p class="res-big"><b>SNR ' + L.fmt(snrNow, 1) + '</b><span>not above the noise yet: keep stacking</span></p>') +
      '<dl class="kv"><dt>Windows stacked</dt><dd>40 (120 s of noise)</dd><dt>Predicted t<sub>AB</sub></dt><dd>' + L.fmt(tAB, 2) + ' s</dd>' + (vEst ? '<dt>Measured lag</dt><dd>+' + L.fmt(lagP, 2) + ' s · −' + L.fmt(-lagN, 2) + ' s</dd>' : '') + '<dt>Signal-to-noise ratio</dt><dd>' + L.fmt(snrNow, 1) + '</dd></dl></div>';
    var trRes = '<div class="res"><h3>Refocusing</h3><p class="res-big"><b>0.41 λ</b><span>focal spot width, FWHM of p² · theory for a perfect ring: 0.36 λ</span></p><dl class="kv"><dt>Focus vs. true source</dt><dd>0.02 km · 0.05 λ</dd><dt>Spot width (FWHM), x</dt><dd>0.42 λ</dd><dt>Spot width (FWHM), z</dt><dd>0.40 λ</dd><dt>Wavelength λ</dt><dd>0.33 km</dd></dl><p>A full ring reaches the diffraction limit: a spot about λ/2 wide in pressure, 0.36 λ at half maximum of p².</p></div>';
    document.getElementById('frags').innerHTML = '<div class="insp frag">' + el + '</div><div class="insp frag">' + noiseRes + '</div><div class="insp frag">' + trRes + '</div>';
    document.getElementById('g-kpi').outerHTML = (vEst ? '<span class="kpi"><b>' + L.fmt(vEst, 2) + ' km/s</b>from the lag</span>' : '') + '<span class="kpi dim"><b>SNR ' + L.fmt(snrNow, 1) + '</b>' + nW + ' windows</span>';
  }
  frags();
  if (ONLY && ONLY.split(',').indexOf('j1') >= 0 && ONLY.split(',').indexOf('j') < 0) [].slice.call(document.querySelectorAll('.frag'), 1).forEach(function (e) { e.style.display = 'none'; });

  var DRAW = { a: drawA, b: drawB, c: drawC, d: drawD, e: drawE, g: drawG, h: drawH };
  function drawAll() {
    L.setPal();
    var vis = function (el) { return el.clientWidth > 0; };   /* ?only= hides the other items */
    Object.keys(DRAW).forEach(function (id) { var c = document.getElementById('c-' + id); if (!vis(c)) return; var f = L.fit(c); DRAW[id](f.ctx, f.w, f.h); });
    if (vis(document.getElementById('v-f'))) drawF(); if (vis(document.getElementById('v-i'))) drawI();
  }
  L.initTheme(document.getElementById('themeBtn'), drawAll);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { drawAll(); window.__info = { shortened: L.shortened, vEst: vEst, snr: snrNow, lagP: lagP, lagN: lagN, fanC: window.__fanC, fanD: window.__fanD, fitF: window.__fitF, fitI: window.__fitI }; document.documentElement.dataset.ready = '1'; });
})();
</script>
